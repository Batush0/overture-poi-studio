services:
  overture-poi-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overture-poi-studio
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./cache:/app/cache
      - ./output:/app/output
    restart: unless-stopped
